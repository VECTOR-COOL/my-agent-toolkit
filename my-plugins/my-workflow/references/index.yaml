# 全域規則（rules/global.md）由 plugin 的 SessionStart hook 常駐注入，不在索引內。記憶相關先載 my-memory。然後只讀 when 或 keywords 對得上的那一筆。不要一次全載。
# rules 區的檔案路徑相對於 plugin 根目錄；碰到 when 的情境才讀，沒碰到不讀。
# 記憶規則在 skills/my-memory/rules/ 與 skills/my-memory-consolidate/rules/，載入該 skill 時一併讀。
# 記憶：依客戶端只讀 my-memory/references/ 對應那一份。
# version 與 pack.yaml、toolkit project.json 同一個號。
# keywords 是使用者會說的詞，用來提高命中。不要把整段說明抄進來。

version: 1.16.0

skills:
  - name: my-workflow
    when: 新對話開始、不確定該用哪個 skill 時
    keywords: [my-workflow, 不知道用哪個 skill, 工作習慣, 入口, 怎麼做, 選 skill]
  - name: my-plugin-install
    when: 安裝、更新、檢查或移除 plugin；依平台（Claude Code、Claude 網頁與 Cowork、雲端 session、Codex、ChatGPT）自動選方法
    keywords: [安裝, 更新, 檢查更新, plugin, 外掛, 版本, 看不到新版, 沒生效, marketplace, install, update, Cowork, claude.ai]
  - name: my-memory
    when: 記住／回想偏好、決策或查詢歷史脈絡；使用者問自己、公司、團隊的既有資訊而對話裡沒有答案時
    keywords: [記住, 回想, 偏好, 決策, 記憶, 永久記憶, Mem0, 歷史紀錄, 個人習慣, 查詢記憶, 記一下, 我的, 公司地址, 公司資料, 聯絡方式, 電話, 統編, 你記得, 之前說過, 先前決定]
  - name: my-memory-consolidate
    when: 查到 Mem0 時用該次命中去重、升中期並加權；權重達到 3 升長期；低權重且存放滿 30 天必須刪除。寫入不另搜
    keywords: [記憶整理, 整理記憶, 升長期, 中期, 去重, 合併, 閥值, 權重, 遺忘, 刪短期, consolidate]
  - name: my-notion
    when: 操作 Notion 知識庫、資料庫、頁面與 View
    keywords: [Notion, 資料庫, 知識庫, 頁面, View, notion kb, 資料結構]
  - name: my-docs
    when: 撰寫技術規格（SPEC）、操作指南、ADR、計畫，決定文件放哪與 docs/ 結構，或檢查 AGENTS/README
    keywords: [文件, 規格, SPEC, 操作手冊, AGENTS, README, ADR, 技術文件, API 規格, 撰寫文檔, 架構決策, 計畫, plan, docs 結構, 文件放哪, 文件命名, 歸檔]
  - name: my-ui-ux
    when: 做網站或介面設計、定義 DESIGN.md 與視覺方向
    keywords: [UI, UX, 新網站, 版面, 視覺, 案例, DESIGN.md, frontend-design, 前端設計, 切版, 設計系統]
  - name: my-review
    when: 審查計畫架構、程式碼（Code Review / PR）或驗收收尾
    keywords: [review, 審查, code review, 程式碼審查, PR 審查, 檢查代碼, 檢查 PR, 拉回目標, 收尾, 驗收, 偏離目標]
  - name: my-create-prd
    when: 需求訪談、撰寫或補強產品需求文件（PRD）
    keywords: [PRD, 產品需求, 需求訪談, 需求文件, 功能規格, 產品規格, 寫 PRD]
  - name: my-codebase-clear
    when: 掃描與清理專案無用檔案、快取與過期日誌
    keywords: [清理, 垃圾檔, cleanup, 刪除, 候選, 清理專案, 清除暫存, 釋放空間, codebase-clear]
  - name: my-codebase-init
    when: 從模板初始化新專案骨架與建立 GitHub 私有版控
    keywords: [初始化, 新專案, 模板, 尚未版控, GitHub, 開新專案, 建立 repo, project init]
  - name: my-release-packaging
    when: 建立正式發佈包與增量更新檔的打包規則與流程：.gitattributes export-ignore、打包腳本、發佈規格書、審核有無洩漏機敏檔、解壓覆蓋部署
    keywords: [打包, 發佈包, 更新檔, 增量更新, 部署包, 占位, 空目錄, img, 上傳目錄, release, packaging, zip, 正式環境, export-ignore, gitattributes, 發佈規格, 洩漏, 解壓覆蓋, since, 部署 SOP]
  - name: my-commit-all-and-push
    when: 安全檢查變更並以 Conventional Commits 提交與推送
    keywords: [commit, push, 提交, 推送, 全部提交, commit all, 一鍵提交, git push, 推上去, 提交變更]
  - name: my-cloud-agent
    when: 開、續、查、停雲端或遠端 agent session，派任務並驗收；對齊雲端環境與冷啟動
    keywords: [雲端 agent, Cloud Agent, 開雲端, 派到雲端, 背景 session, 雲端對話, 冷啟動, 雲端環境, claude --cloud, teleport, create_session, remote-env]
  - name: my-subagent
    when: 拆解大任務、派發平行 subagent 與調度驗收
    keywords: [平行, 多線, subagent, 派發, 驗收, 多代理, 平行任務, 分工處理, 分工, 開 subagent, 叫幾個 agent, 一起做, 派出去]

rules:
  - name: git
    file: rules/git.md
    when: commit、push、branch、merge、rebase、發版、tag、解衝突
    keywords: [commit, push, pull, 同步, stash, git, 分支, 合併, merge, rebase, 發版, release, tag, 衝突, force push]
  - name: code-review
    file: rules/code-review.md
    when: 審查原始碼、變更檔案、Git Diff 或 PR
    keywords: [review, code review, 審查, PR, diff, 程式碼審查]
  - name: wrap-up
    file: rules/wrap-up.md
    when: 任務完成、審查通過、準備交付或驗收
    keywords: [收尾, 驗收, 交付, 完成, 文件同步, E2E, 測試覆蓋]
  - name: files-and-scripts
    file: rules/files-and-scripts.md
    when: 寫腳本、產生測試檔或臨時檔、編輯設定檔
    keywords: [腳本, script, .mjs, 臨時檔, scripts/tmp, 設定檔, JSONC, 清理暫存]
  - name: install
    file: rules/install.md
    when: 安裝套件、第三方 skill 或 rule
    keywords: [安裝, install, npm, pip, brew, 套件, 第三方 skill, 授權]
  - name: tools
    file: rules/tools.md
    when: 使用外部服務、App 或 MCP，或 MCP 連線失敗
    keywords: [Composio, MCP, 外部服務, 連線失敗, 重新登入, Notion, Linear]
